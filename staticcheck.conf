# staticcheck.conf — checks for `staticcheck ./...` (CI runs it on every push,
# both build flavors).
#
# ST1005 (error strings must be lowercase, no trailing punctuation) is aimed at
# terse programmatic errors that get wrapped into longer chains. vmxplore
# deliberately returns user-facing prose from failures an operator has to act
# on — "console tunnel to host never came up — is the guest's VNC port open on
# its loopback?" is a sentence on purpose. Silencing the check beats degrading
# those messages. Everything else stays on.
checks = ["inherit", "-ST1005"]
